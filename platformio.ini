[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
; 2 slots de app de 1,9 MB (mantem OTA) e SPIFFS minimo: so a pilha de Wi-Fi ja
; ocupa ~540 KB e o slot padrao (1,25 MB) estoura com TLS/BLE. NVS fica no mesmo lugar.
board_build.partitions = min_spiffs.csv
; CAs raiz para validar HTTPS (gerado por tools/gen_ca_bundle.py, ~54 KB de flash)
board_build.embed_files = data/cert/x509_crt_bundle.bin

lib_deps =
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.2.0
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@~8.3.11

; -O2 no lugar de -Os: o renderizador do LVGL fica bem mais rapido (sobra flash).
build_unflags = -Os
build_flags =
    -O2
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=0
    -DUI_PERF  ; contador de FPS na tela; remover quando a fluidez estiver ok

; Esta placa nao entra em modo download sozinha (sem auto-reset): a gravacao
; espera voce segurar BOOT e tocar RST. Ver tools/flash.py.
upload_protocol = custom
upload_command = "$PYTHONEXE" tools/flash.py $UPLOAD_PORT $SOURCE
